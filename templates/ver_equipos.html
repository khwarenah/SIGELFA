<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Plantillas de Equipos - SIGELFA</title>
<style>
    :root {
        --primary: #0f172a;
        --accent: #3b82f6;
        --success: #10b981;
        --bg: #f8fafc;
        --white: #ffffff;
        --text: #1e293b;
        --border: #e2e8f0;
    }

    body { 
        font-family: 'Inter', 'Segoe UI', sans-serif; 
        background: var(--bg); 
        color: var(--text);
        margin: 0; 
        padding: 40px 20px;
        line-height: 1.5;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    /* --- BOTÓN VOLVER (ESTILO UNIFICADO) --- */
    .btn-volver { 
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 24px; 
        color: #64748b;
        text-decoration: none; 
        font-weight: 600; 
        font-size: 14px;
        padding: 10px 18px;
        border-radius: 8px;
        background-color: white;
        border: 1px solid var(--border);
        transition: all 0.2s ease;
        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    .btn-volver:hover { 
        color: var(--primary); 
        background-color: #f1f5f9;
        border-color: #cbd5e1;
        transform: translateX(-5px);
    }

    h1 {
        text-align: center;
        color: var(--primary);
        font-weight: 800;
        margin-bottom: 40px;
        letter-spacing: -0.025em;
    }

    /* --- GRID DE EQUIPOS --- */
    .grid-equipos { 
        display: grid; 
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
        gap: 24px; 
    }

    /* --- TARJETA DE EQUIPO (FICHA TÉCNICA) --- */
    .card-equipo { 
        background: white; 
        border-radius: 16px; 
        overflow: hidden; 
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); 
        border: 1px solid var(--border);
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .card-equipo:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 20px -5px rgba(0,0,0,0.1);
    }

    .header-equipo { 
        background: linear-gradient(135deg, var(--primary) 0%, #334155 100%); 
        color: white; 
        padding: 20px; 
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .header-equipo h2 { 
        margin: 0; 
        font-size: 1.3rem; 
        font-weight: 800;
        letter-spacing: -0.01em;
    }

    .badge-cat { 
        background: var(--accent); 
        color: white;
        padding: 4px 12px; 
        border-radius: 9999px; 
        font-size: 0.75rem; 
        font-weight: 700;
        text-transform: uppercase;
        display: inline-block;
        align-self: flex-start;
    }

    /* --- LISTA DE JUGADORES --- */
    .lista-jugadores { padding: 20px; }

    .jugador-row { 
        display: flex; 
        justify-content: space-between; 
        align-items: center;
        padding: 12px 0; 
        border-bottom: 1px solid #f1f5f9; 
        font-size: 0.95rem; 
        transition: padding-left 0.2s;
    }

    .jugador-row:hover {
        padding-left: 5px;
        color: var(--accent);
    }

    .jugador-row:last-child { border-bottom: none; }

    .nombre-jugador {
        font-weight: 600;
        color: var(--text);
    }

    .edad { 
        background: #f1f5f9;
        color: #64748b; 
        font-size: 0.75rem;
        padding: 2px 8px;
        border-radius: 6px;
        font-weight: 700;
    }

    /* Estado cuando no hay jugadores */
    .no-players {
        text-align: center;
        color: #94a3b8;
        font-style: italic;
        font-size: 0.85rem;
        padding: 20px 0;
    }
</style>
</head>
<body>
    <a href="/" class="btn-volver">← Volver al Inicio</a>
    <h1>Equipos y Jugadores Registrados</h1>

    <div class="grid-equipos">
        {% for nombre, info in equipos.items() %}
        <div class="card-equipo">
            <div class="header-equipo">
                <h2>{{ nombre }}</h2>
                <span class="badge-cat">Categoría: {{ info.categoria }}</span>
            </div>
            <div class="lista-jugadores">
                <strong>Plantilla:</strong>
                {% for j in info.jugadores %}
                <div class="jugador-row">
                    <span>#{{ j.numero }} - {{ j.nombre }}</span>
                    <span class="edad">{{ j.edad }} años</span>
                </div>
                {% else %}
                <p style="color: #991b1b;">Sin jugadores registrados.</p>
                {% endfor %}
            </div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
