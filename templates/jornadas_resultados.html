<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Jornadas y Resultados - SIGELFA</title>
    <style>
        :root { --primary: #1e293b; --bg: #f1f5f9; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; }
        .navbar { background: var(--primary); color: white; padding: 1rem; text-align: center; }
        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
        .jornada-titulo { background: #e2e8f0; padding: 10px; border-radius: 8px; margin: 20px 0 10px; font-weight: bold; color: #475569; }
        .partido-card { 
            background: var(--white); border-radius: 10px; padding: 20px; 
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 10px;
        }
        .equipo { flex: 1; font-weight: bold; font-size: 1.1rem; }
        .local { text-align: right; padding-right: 15px; }
        .visita { text-align: left; padding-left: 15px; }
        .marcador { 
            background: #1e293b; color: white; padding: 8px 20px; 
            border-radius: 5px; font-size: 1.2rem; font-weight: bold;
            min-width: 50px; text-align: center;
        }
        .vs { color: #94a3b8; font-style: italic; }
        .fecha { font-size: 0.8rem; color: #64748b; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/" style="color: white; text-decoration: none;">🏠 Volver al Menú Principal</a>
    </div>

    <div class="container">
        <h1 style="text-align: center; color: var(--primary);">Calendario de Resultados</h1>

        {% for p in partidos %}
        <div class="partido-card">
            <div class="equipo local">
                {{ p.Local }}
            </div>

            <div class="marcador-container" style="text-align: center;">
                 <div class="marcador">
                 {% if p.Jugado > 0 %}
                {{ p.GolesL }} - {{ p.GolesV }}
                {% else %}
                <span class="vs">vs</span>
                {% endif %}
                </div>
                <div class="fecha">Jornada {{ p.numJornada }} - {{ p.fechaPart }}</div>
            </div>

            <div class="equipo visita">
                {{ p.Visita }}
            </div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
