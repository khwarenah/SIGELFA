<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Conceptos - SIGELFA</title>
<style>
    :root {
        --primary: #0f172a;
        --accent: #3b82f6;
        --success: #10b981;
        --danger: #ef4444;
        --bg: #f8fafc;
        --text: #1e293b;
        --border: #e2e8f0;
    }

    body { 
        font-family: 'Inter', 'Segoe UI', sans-serif; 
        background-color: var(--bg); 
        color: var(--text);
        padding: 40px 20px;
        margin: 0;
        line-height: 1.5;
    }

    .container { max-width: 900px; margin: 0 auto; }

    /* --- BOTÓN VOLVER --- */
    .btn-back { 
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 24px; 
        color: #64748b;
        text-decoration: none; 
        font-weight: 600; 
        font-size: 14px;
        padding: 10px 18px;
        border-radius: 8px;
        background-color: white;
        border: 1px solid var(--border);
        transition: all 0.2s ease;
        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    .btn-back:hover { 
        color: var(--primary); 
        background-color: #f1f5f9;
        border-color: #cbd5e1;
        transform: translateX(-5px);
    }

    /* Tarjetas Modernas */
    .card { 
        background: white; 
        padding: 30px; 
        border-radius: 16px; 
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        margin-bottom: 24px; 
        border: 1px solid var(--border);
    }

    h2 { 
        margin-top: 0; 
        color: var(--primary); 
        font-weight: 800;
        font-size: 1.4rem;
        border-bottom: 1px solid var(--border); 
        padding-bottom: 12px;
        margin-bottom: 25px;
    }

    /* Formulario en Grid (3 columnas) */
    .form-grid { 
        display: grid; 
        grid-template-columns: repeat(3, 1fr); 
        gap: 20px; 
    }
    
    label { 
        display: block; 
        font-weight: 700; 
        margin-bottom: 8px; 
        color: #475569; 
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.025em;
    }

    input, select { 
        width: 100%; 
        padding: 12px; 
        border: 1px solid var(--border); 
        border-radius: 8px; 
        box-sizing: border-box;
        font-size: 14px;
        transition: all 0.2s;
        background-color: white;
        color: var(--text);
    }

    input:focus, select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    /* Botones de Acción */
    .btn-add { 
        background-color: var(--success); 
        color: white; 
        width: 100%; 
        margin-top: 25px;
        padding: 14px;
        border: none;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
        font-size: 15px;
        transition: all 0.2s;
    }

    .btn-add:hover { 
        background-color: #059669; 
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
    }

    .btn-del { 
        background-color: #fff1f2; 
        color: var(--danger); 
        padding: 6px 12px;
        border: 1px solid #fecaca;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 700;
        font-size: 12px;
        transition: all 0.2s;
    }

    .btn-del:hover { 
        background-color: var(--danger); 
        color: white; 
    }

    /* Tabla de Conceptos */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    
    th { 
        padding: 14px; 
        text-align: left; 
        background-color: #f1f5f9; 
        color: #475569; 
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 700;
        border-bottom: 2px solid var(--border);
    }

    td { 
        padding: 16px 14px; 
        border-bottom: 1px solid var(--border); 
        font-size: 14px;
        color: #334155;
    }

    tr:hover td { background-color: #f8fafc; }
    tr:last-child td { border-bottom: none; }

    strong { color: var(--primary); }
</style>
</head>
<body>
<div class="container">
    <a href="/" class="btn-back">← Volver al Menú</a>
    <div class="card">
        <h2>Nuevo Concepto (Catálogo)</h2>
        <form method="POST">
            <input type="hidden" name="accion" value="crear">
            <div class="form-grid">
                <div><label>Clave (Ej: INS)</label><input type="text" name="cveConc" required maxlength="3"></div>
                <div><label>Descripción</label><input type="text" name="descConc" required maxlength="30"></div>
                <div>
                    <label>Liga Asociada</label>
                    <select name="cveLiga" required>
                        <option value="">-- Seleccionar --</option>
                        {% for liga in ligas %}
                        <option value="{{ liga.cveLiga }}">{{ liga.nombLiga }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <button type="submit" class="btn-add">Guardar Concepto</button>
        </form>
    </div>

    <div class="card">
        <h2>Catálogo de Conceptos</h2>
        <table>
            <tr><th>Clave</th><th>Descripción</th><th>Liga</th><th>Acción</th></tr>
            {% for c in conceptos %}
            <tr>
                <td><strong>{{ c.cveConc }}</strong></td>
                <td>{{ c.descConc }}</td>
                <td>{{ c.cveLiga }}</td>
                <td>
                    <form method="POST" style="display:inline;">
                        <input type="hidden" name="accion" value="eliminar">
                        <input type="hidden" name="cveConc" value="{{ c.cveConc }}">
                        <button type="submit" class="btn-del">Borrar</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </table>
    </div>
</div>
</body>
</html>
